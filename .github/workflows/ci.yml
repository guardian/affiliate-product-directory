# Find full documentation here https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: CI

on:
  pull_request:

  # Manual invocation.
  workflow_dispatch:

  push:
    branches:
      - main

# Ensure we only ever have one build running at a time.
# If we push twice in quick succession, the first build will be stopped once the second starts.
# This avoids any race conditions.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest

    permissions:
      contents: read

      # These permissions are required by guardian/actions-riff-raff...
      id-token: write # ...to exchange an OIDC JWT ID token for AWS credentials
      pull-requests: write #...to comment on PRs

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: test
        run: npm test

      - name: Build
        run: npm run build

      # Served by actions-static-site at /_prout without auth, so the deployed commit can be checked
      - name: Write the current git hash to the affiliate-products-client build
        run: git rev-parse HEAD > packages/affiliate-products-client/build/_prout

      - name: Upload affiliate-products-client artifact
        uses: actions/upload-artifact@v4
        with:
          path: packages/affiliate-products-client/build

      - name: Synth CDK
        run: npm -w cdk run synth

      # See https://github.com/guardian/actions-riff-raff
      - name: Upload to riff-raff
        uses: guardian/actions-riff-raff@v4
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          projectName: frontend::affiliate-product-directory
          configPath: packages/cdk/cdk.out/riff-raff.yaml
          contentDirectories: |
            cdk.out:
              - packages/cdk/cdk.out
            product-price-update-lambda:
              - packages/product-price-update-lambda/dist/product-price-update-lambda.zip
            product-directory-update-lambda:
              - packages/product-directory-update-lambda/dist/product-directory-update-lambda.zip

  # Deploys the affiliate-products-client to the Deploy Tools account, behind Google auth.
  # See https://github.com/guardian/actions-static-site
  static-site-CODE:
    needs: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: guardian/actions-static-site@v3
        with:
          app: affiliate-products-CODE
          domain: affiliate-products.code.dev-gutools.co.uk
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
