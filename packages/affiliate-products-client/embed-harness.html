<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Embed harness</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				font-size: 14px;
				margin: 16px;
				display: grid;
				grid-template-columns: minmax(0, 1fr) 380px;
				gap: 16px;
				align-items: start;
			}
			textarea {
				width: 100%;
				box-sizing: border-box;
				height: 60vh;
				font:
					12px ui-monospace,
					monospace;
			}
			iframe {
				width: 100%;
				height: 120px;
				border: 1px solid #ccc;
			}
			ol {
				font:
					12px ui-monospace,
					monospace;
				padding-left: 20px;
			}
		</style>
	</head>
	<body>
		<!-- Stands in for Composer in local dev, which Vite serves at /embed-harness.html. It isn't in the build. -->
		<main>
			<p>
				The content message Composer would send. Edit it and the embed is sent
				it again a second later.
			</p>
			<textarea id="content" spellcheck="false"></textarea>
			<p><button id="reload" type="button">Reload the embed</button></p>
			<h2>Messages</h2>
			<ol id="log" reversed></ol>
		</main>
		<iframe id="embed" title="Products and prices" src="/embed"></iframe>
		<script type="module" src="/src/embedHarness.ts"></script>
	</body>
</html>
